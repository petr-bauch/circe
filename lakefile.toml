name = "circe"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Circe"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

# Pillar 4 (Phase 1 MVP): MoSeL proof interface only — no program
# logic, no oracle/Mem changes. Pinned to the release tag matching
# our toolchain (Phase 0: Qq/Batteries revs identical to ours).
[[require]]
name = "iris"
git.url = "https://github.com/leanprover-community/iris-lean.git"
git.subDir = "Iris"
rev = "v4.34.0"

[[lean_lib]]
name = "Circe"

# Frontend example (README "For users"): its own lib/directory, the
# user's own files, importing only `Circe.*` (the external-user shape
# inside one workspace so the gate stays hermetic — no nested package
# builds). `Hello.Emitted` is generated by `circe-emit` (committed as
# the pin; the gate re-emits to a scratch path and byte-compares).
[[lean_lib]]
name = "Hello"
srcDir = "examples/hello"
roots = ["Hello"]

[[lean_lib]]
name = "Suites"
srcDir = "tests/lean"
roots = ["DerivedNoalias","DiffAcc","DiffArith","DiffArray","DiffBox","DiffCalls","DiffFlow","DiffMethod","DiffMove","DiffNorestrict","DiffOptional","DiffOverload","DiffPhase3","DiffPhase4","DiffStruct","DiffSpan","DiffSumTwo","DiffTadd","DiffVec","DiffVec2","DiffVec64","DiffVecLeak","DiffVecRealloc","DiffVecRead","DiffVecAt","DiffVecAtSum","DiffVecMarkCount","DiffVecMarkCountC","DiffVecMatAt","DiffVecKadane","DiffVecBinarySearch","DiffVecTwoSum","DiffVecAtSet","DiffVecMergeInto","DiffVecTransformAdd","DiffVecPartition","DiffVecSelectionSort","DiffVecMergeSort","DiffVecQuicksort","DiffVecReverse","DiffVecSegReverse","DiffVecRotate","DiffReserve","DiffInsert","DiffErase","DiffSort","DiffView","DiffWidth","DiffXorN","DiffQr","DiffChacha","DiffChacha20Encrypt","DiffSha","GoldenAcc","GoldenArray","GoldenBox","GoldenCalls","GoldenFlow","GoldenFreeDiscipline","GoldenM2Setup","GoldenMethod","GoldenMove","GoldenArraySort","GoldenArraySort8","GoldenAliasProbe","GoldenOptional","GoldenOverload","GoldenPhase4","GoldenPhase6","GoldenPhase7","GoldenReadOnly","GoldenRejectCatalog","GoldenSpan","GoldenStruct","GoldenSumTwo","GoldenTadd","GoldenVec2","GoldenVec64","GoldenVecRealloc","GoldenVecRead","GoldenVecGrow","GoldenVecAt","GoldenVecAtSum","GoldenVecMarkCount","GoldenVecMarkCountC","GoldenVecMatAt","GoldenVecKadane","GoldenVecBinarySearch","GoldenVecTwoSum","GoldenVecAtSet","GoldenVecMergeInto","GoldenVecTransformAdd","GoldenVecPartition","GoldenVecSelectionSort","GoldenVecMergeSort","GoldenVecQuicksort","GoldenVecReverse","GoldenVecSegReverse","GoldenVecRotate","GoldenView","GoldenWidth","GoldenXorN","GoldenChacha","GoldenChacha20Encrypt","GoldenSha","ScopeReport","ReborrowGate","GoldenReborrow","DiffReborrow","GoldenReborrow34","DiffReborrow34","WrPairGate","GoldenWrPair","DiffWrPair","CondPairGate","GoldenCondPair","DiffCondPair","AliasCondGate","GoldenAliasCond","DiffAliasCond","HoareGallery","LoopOobGallery"]

[[lean_exe]]
name = "circe-test"
root = "Test.Driver"

[[lean_exe]]
name = "circe-emit"
root = "tools.EmitCli"

