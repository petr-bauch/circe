name = "circe"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Circe"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "Circe"

[[lean_lib]]
name = "Suites"
srcDir = "tests/lean"
roots = ["DerivedNoalias","DiffAcc","DiffArith","DiffArray","DiffBox","DiffCalls","DiffFlow","DiffMethod","DiffMove","DiffNorestrict","DiffOptional","DiffOverload","DiffPhase3","DiffPhase4","DiffStruct","DiffSpan","DiffTadd","DiffVec","DiffVec2","DiffVec64","DiffVecLeak","DiffVecRealloc","DiffVecRead","DiffReserve","DiffInsert","DiffErase","DiffSort","DiffView","DiffWidth","DiffXorN","DiffQr","DiffChacha","GoldenAcc","GoldenArray","GoldenBox","GoldenCalls","GoldenFlow","GoldenFreeDiscipline","GoldenM2Setup","GoldenMethod","GoldenMove","GoldenArraySort","GoldenArraySort8","GoldenAliasProbe","GoldenOptional","GoldenOverload","GoldenPhase4","GoldenPhase6","GoldenPhase7","GoldenReadOnly","GoldenRejectCatalog","GoldenSpan","GoldenStruct","GoldenTadd","GoldenVec2","GoldenVec64","GoldenVecRealloc","GoldenVecRead","GoldenVecGrow","GoldenView","GoldenWidth","GoldenXorN","GoldenChacha","ScopeReport"]

[[lean_exe]]
name = "circe-test"
root = "Test.Driver"

